[project]
name = "presence-analyzer"
version = "0.1.0"
description = "Creator presence analysis CLI — pose-based scoring with confidence bounds"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==0.10.18",
    "opencv-python-headless==4.10.0.84",
    "eva-decord==0.6.1; sys_platform == 'darwin'",
    "decord==0.6.0; sys_platform != 'darwin'",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "numba==0.60.0",
    "polars==1.12.0",
    "pyarrow==17.0.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "typer==0.13.0",
    "click<8.2",
    "rich==13.9.4",
    "joblib==1.4.2",
    "tqdm==4.66.6",
    "ffmpeg-python==0.2.0",
    "scikit-learn==1.5.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-benchmark==4.0.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
]

[project.scripts]
presence = "presence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
